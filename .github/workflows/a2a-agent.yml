name: A2A Agent

on:
  repository_dispatch:
    types: [a2a-message]

  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      test_message:
        description: 'Send a test A2A message'
        required: false
        type: boolean

jobs:
  a2a-agent:
    runs-on: ubuntu-latest
    name: A2A Agent Handler

    env:
      A2A_ENDPOINT: ${{ secrets.A2A_ENDPOINT }}
      A2A_AGENT_ID: ${{ secrets.A2A_AGENT_ID }}
      A2A_API_KEY: ${{ secrets.A2A_API_KEY }}
      A2A_CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx pyjwt cryptography

      - name: Handle A2A Message
        if: github.event_name == 'repository_dispatch'
        run: |
          python << 'PYEOF'
          import os
          import json
          import httpx
          from datetime import datetime
          import time

          endpoint = os.environ.get('A2A_ENDPOINT', '')
          agent_id = os.environ.get('A2A_AGENT_ID', 'unknown')
          api_key = os.environ.get('A2A_API_KEY', '')

          event_payload = os.environ.get('A2A_CLIENT_PAYLOAD', '{}')
          try:
              payload = json.loads(event_payload) if event_payload.strip() else {}
          except json.JSONDecodeError:
              payload = {}

          message = payload.get('message', {})
          sender_id = message.get('sender_id', 'unknown')
          correlation_id = message.get('correlation_id', '')
          message_type = message.get('message_type', '')
          task_payload = message.get('payload', {})

          print(f'Received {message_type} from {sender_id}, correlation_id={correlation_id}')

          if message_type != 'TASK_REQUEST':
              print(f'Unsupported message type: {message_type}')
              exit(0)

          task_name = task_payload.get('task', '')
          print(f'Processing task: {task_name}')

          import subprocess
          task_input = json.dumps(task_payload)
          try:
              proc = subprocess.run(
                  ['python', 'agent_logic.py', task_input],
                  capture_output=True, text=True, timeout=180
              )
              result_output = proc.stdout or proc.stderr or "No output"
          except Exception as e:
              result_output = f"Error: {str(e)}"

          response = {
              'sender_id': agent_id,
              'receiver_id': sender_id,
              'message_type': 'TASK_RESPONSE',
              'payload': {
                  'original_task': task_name,
                  'result': result_output,
                  'status': 'completed'
              },
              'correlation_id': correlation_id,
              'timestamp': datetime.utcnow().isoformat(),
              'version': '1.0',
          }

          auth_headers = {'Authorization': f'Bearer {api_key}'}
          message_id = None

          def send_response():
              with httpx.Client() as client:
                  resp = client.post(
                      f"{endpoint}/a2a/messages",
                      json=response,
                      headers=auth_headers,
                      timeout=30.0,
                  )
                  return resp

          def verify_delivery(corr_id, timeout_secs=15):
              for attempt in range(timeout_secs):
                  try:
                      with httpx.Client() as client:
                          resp = client.get(
                              f"{endpoint}/a2a/messages/by-correlation/{corr_id}?consume=false",
                              headers=auth_headers,
                              timeout=5.0,
                          )
                          if resp.status_code == 200:
                              data = resp.json()
                              if data.get('found'):
                                  print(f'Delivery verified for correlation_id={corr_id}')
                                  return True
                  except Exception:
                      pass
                  time.sleep(1)
              return False

          print(f'Sending TASK_RESPONSE to {sender_id}...')
          max_retries = 3
          for retry in range(max_retries):
              try:
                  resp = send_response()
                  if resp.status_code == 200:
                      data = resp.json()
                      message_id = data.get('message_id')
                      print(f'Response sent: message_id={message_id}, status={resp.status_code}')
                      break
                  else:
                      print(f'Retry {retry+1}/{max_retries}: status={resp.status_code}')
              except Exception as e:
                  print(f'Retry {retry+1}/{max_retries}: {e}')
              
              if retry < max_retries - 1:
                  wait = 2 ** retry
                  print(f'Waiting {wait}s before retry...')
                  time.sleep(wait)
          else:
              print('FAILED: All retries exhausted')
              exit(1)

          print(f'Verifying delivery (correlation_id={correlation_id})...')
          if verify_delivery(correlation_id, timeout_secs=15):
              print('Delivery CONFIRMED')
          else:
              print('WARNING: Delivery could not be verified within timeout')
          PYEOF

      - name: Send Heartbeat
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python << 'PYEOF'
          import os
          import httpx
          from datetime import datetime

          endpoint = os.environ.get('A2A_ENDPOINT', '')
          agent_id = os.environ.get('A2A_AGENT_ID', 'unknown')
          api_key = os.environ.get('A2A_API_KEY', '')

          heartbeat = {
              'sender_id': agent_id,
              'receiver_id': None,
              'message_type': 'HEARTBEAT',
              'payload': {
                  'status': 'READY',
                  'load': 0.3,
                  'tools': ['code_generation', 'testing', 'review'],
                  'repository': os.environ.get('GITHUB_REPOSITORY', 'unknown'),
              },
              'correlation_id': os.environ.get('GITHUB_RUN_ID', 'unknown'),
              'timestamp': datetime.utcnow().isoformat(),
          }

          with httpx.Client() as client:
              resp = client.post(
                  f"{endpoint}/a2a/channels/broadcast",
                  json=heartbeat,
                  headers={'Authorization': f'Bearer {api_key}'},
                  timeout=10.0,
              )
              print(f'Heartbeat sent: {resp.status_code}')
          PYEOF
